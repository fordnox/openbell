name: OpenBell
options:
  bundleIdPrefix: com.camosec
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: VBTQQJK27C
    ENABLE_HARDENED_RUNTIME: YES
targets:
  OpenBell:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle auto-update (Developer ID builds only; disabled at runtime for App Store builds).
        SUFeedURL: https://raw.githubusercontent.com/fordnox/openbell/main/appcast.xml
        SUPublicEDKey: hlOP/B9kmeYeiQ7yHhqovpsoUewXdNe+ZkElzMOQ1Fc=
        # Sandboxed app: install via Sparkle's launcher XPC service, download via its downloader service.
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camosec.openbell
        PRODUCT_NAME: OpenBell
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenBell
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: App/OpenBell.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
    dependencies:
      - target: OpenBellWidget
      - package: Sparkle
  OpenBellWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: OpenBell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camosec.openbell.widget
        PRODUCT_NAME: OpenBellWidget
        CODE_SIGN_ENTITLEMENTS: Widget/OpenBellWidget.entitlements
        SKIP_INSTALL: YES
